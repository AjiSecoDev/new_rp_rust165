<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hola desde Rust</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #0f1115;
    color: #e6e6e6;
    text-align: center;
  }
  main { padding: 2rem; }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 .5rem; }
  p { margin: .25rem 0; color: #9aa4b2; }
  code { color: #f0883e; }
  .card {
    margin-top: 2rem;
    padding: 1rem 1.5rem;
    border: 1px solid #262a33;
    border-radius: 12px;
    background: #151922;
  }
  #estado { font-weight: bold; }
  .ok { color: #3fb950; }
  .error { color: #f85149; }
</style>
</head>
<body>
<main>
  <h1>Hola desde Rust</h1>
  <p>Servidor HTTP con <code>std::net::TcpListener</code> &mdash; cero dependencias.</p>
  <p>Desplegado en Render.</p>
  <div class="card">
    <p id="estado">Comprobando <code>/health</code>...</p>
  </div>
</main>
<script>
  fetch('/health')
    .then(r => r.text())
    .then(t => {
      document.getElementById('estado').innerHTML =
        '<span class="ok">/health: ' + t + '</span>';
    })
    .catch(() => {
      document.getElementById('estado').innerHTML =
        '<span class="error">/health no responde</span>';
    });
</script>
</body>
</html>
